# face-detect: camera + LCD + TFLM inference, IOTCONNECT over cellular.
# Vision options carried from the original iotc-mcx-zephyr-demos app; the
# cloud/provisioning block matches the quickstart demo (identity in NVS,
# on-device keygen, public CA roots only).

# --- SDK + cloud (quickstart provisioning flow) ------------------------------
CONFIG_IOTCONNECT=y
CONFIG_IOTCONNECT_DRA=y
CONFIG_IOTCONNECT_CT_AWS=y
CONFIG_IOTCONNECT_DRA_DISCOVERY_HOST="awsdiscovery.iotconnect.io"
CONFIG_IOTCONNECT_IDENTITY_NVS=y
CONFIG_IOTCONNECT_ONDEVICE_KEYGEN=y
CONFIG_IOTCONNECT_SHELL=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="iotc_mbedtls_config.h"
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y

# --- Shell for provisioning (base64 cert/key + JSON paste) -------------------
CONFIG_SHELL=y
CONFIG_SHELL_CMD_BUFF_SIZE=3072
# 2 KB ring: paste the provisioning base64/JSON in chunks (or slow paste)
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024
CONFIG_SHELL_STACK_SIZE=6144
CONFIG_KERNEL_SHELL=y
CONFIG_REBOOT=y

# --- Networking over cellular PPP --------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_PPP=y
CONFIG_NET_L2_PPP_OPTION_DNS_USE=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_DNS_RESOLVER=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_POSIX_API=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_PKT_RX_COUNT=9
CONFIG_NET_PKT_TX_COUNT=9
CONFIG_NET_BUF_RX_COUNT=10
CONFIG_NET_BUF_TX_COUNT=12

# --- Cellular modem (LTE IoT 12 Click / SIMCom SIM7672) ----------------------
# Set the APN for YOUR SIM.
CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y
CONFIG_MODEM_CELLULAR_APN="globaldata"
CONFIG_MODEM_CELLULAR_UART_BUFFER_SIZES=512
CONFIG_MODEM_CELLULAR_CHAT_BUFFER_SIZE=256
CONFIG_MODEM_CELLULAR_USER_PIPE_BUFFER_SIZES=256
CONFIG_UART_ASYNC_API=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PM_DEVICE=y

# --- TLS ----------------------------------------------------------------------
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=44000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_ENTROPY_GENERATOR=y

# --- MQTT / HTTP / SNTP -------------------------------------------------------
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_KEEPALIVE=30
CONFIG_HTTP_CLIENT=y
CONFIG_SNTP=y
CONFIG_POSIX_TIMERS=y

# --- Settings / NVS (provisioned identity) ------------------------------------
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# --- Vision: camera + display --------------------------------------------------
# SmartDMA delivers 320x30 RGB565 slices (8 per QVGA frame): 320*30*2 = 19200 B
# per buffer; two buffers ping-pong (RAM is the scarce resource here).
CONFIG_VIDEO=y
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=39000
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_DISPLAY=y

# --- Inference: TFLM built from source (software model, CMSIS-NN kernels) -----
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# --- App options ---------------------------------------------------------------
CONFIG_APP_LOG_LEVEL=3
# The software model needs ~196 KB (TFLM reported 152 KB short by 43956 B).
CONFIG_APP_TENSOR_ARENA_SIZE_KB=196
CONFIG_FACEDETECT_DEBOUNCE_MS=500
CONFIG_IOTC_MQTT_DEVICE_REPORT_SEC=5
CONFIG_IOTC_INF_STACKSIZE=4096
CONFIG_IOTC_MQTT_KEEPALIVE_SEC=5

# --- System --------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_IOTCONNECT_LOG_LEVEL_INF=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_HW_STACK_PROTECTION=y
# Interrupts stack full FP context once the FPU-heavy inference thread runs;
# the 2 KB default ISR stack overflows (the original demo set 4048 too).
CONFIG_ISR_STACK_SIZE=4096
CONFIG_IOTCONNECT_THREAD_STACK_SIZE=4096
CONFIG_SIZE_OPTIMIZATIONS=y
