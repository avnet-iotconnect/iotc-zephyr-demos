# MIMXRT1170-EVKB (Cortex-M7) board config for the vision-occupancy demo.
#
# Camera: build with --shield nxp_btb44_ov5640 (the OV5640 module shipped with
# the EVK/EVKB, on the J2 connector via MIPI CSI-2). The shield overlay wires
# chosen zephyr,camera to the CSI; this .conf sizes the capture buffers.
# Ethernet: the RT1170-EVK's 100M ENET MAC + onboard PHY are status="okay" in
# the board DTS, so no overlay is needed for networking.
#
# Board target: mimxrt1170_evk/mimxrt1176/cm7 (revision B default).

# --- Video capture buffers ---------------------------------------------------
# 2x QVGA RGB565 frames (2 x 150 KB) + slack; the pool lives in SDRAM
# (zephyr,sram = &sdram0), where 64 MB leaves size uncritical. Sized to also
# fit 2x VGA if the capture format is bumped to 640x480.
# Sized for the pipeline's native 1280x720 BGRX32 ("XR24") x3 buffers (one
# held as the latest frame + two cycling in the DMA) -- the hardware-observed
# default format; QVGA RGB565 is not accepted by this CSI chain.
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=11300000
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4
CONFIG_VIDEO_BUFFER_POOL_ALIGN=64
CONFIG_DMA=y

# --- Bearer: native Ethernet (RT1170 ENET, RMII, onboard PHY) ----------------
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_NXP_ENET=y
CONFIG_MDIO=y

# --- IPv4 via DHCP; auto-bring-up the interface ------------------------------
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
# Bench diagnostics: `net iface` / `net dhcpv4` / ping from the shell.
CONFIG_NET_SHELL=y
CONFIG_NET_DHCPV4_LOG_LEVEL_INF=y

# --- Net buffers sized for a wired link --------------------------------------
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_CONTEXT_RCVTIMEO=y

# Connection/context tables sized for MQTT + DHCP + DNS + back-to-back HTTPS
# (credentials GET then S3 PUT, with the closed socket lingering in
# TIME_WAIT). The IPv4-only default NET_MAX_CONN=4 is exhausted exactly at
# the S3 connect (hardware-observed instant -ENOENT).
CONFIG_NET_MAX_CONN=16
CONFIG_NET_MAX_CONTEXTS=12

# --- mbedTLS heap headroom for cloud broker cert chains ----------------------
CONFIG_MBEDTLS_HEAP_SIZE=60000
