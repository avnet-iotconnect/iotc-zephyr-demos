# FRDM-RW612 board config for the c2d-led demo -- WI-FI, runtime-provisioned.
#
# The RW612's onboard 2.4/5 GHz 802.11ax radio is driven by the in-tree NXP
# Wi-Fi driver. The Wi-Fi firmware is linked into the image (monolithic
# build), so fetch the binary blobs once before building:
#   west blobs fetch hal_nxp
# No devicetree overlay is needed -- the SoC's nxp,wifi node is enabled by
# default.
#
# NOTHING network-specific is compiled in: Wi-Fi credentials are entered at
# the shell and persist in the settings/NVS storage partition, so one binary
# works on any network (WPA2-PSK or open):
#   wifi cred add -s "<ssid>" -k 1 -p "<passphrase>"
# The SDK's Wi-Fi auto-connect (CONFIG_IOTCONNECT_WIFI_AUTOCONNECT) then
# associates at every boot from the stored credentials.
#
# Board target: frdm_rw612.

# --- Bearer: onboard Wi-Fi (NXP RW612, monolithic firmware) -----------------
CONFIG_WIFI=y
CONFIG_WIFI_NXP=y
CONFIG_NXP_RW610=y
CONFIG_ETH_DRIVER=n

# --- Runtime Wi-Fi provisioning (stored credentials + boot auto-connect) ----
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_WIFI_CREDENTIALS_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_IOTCONNECT_WIFI_AUTOCONNECT=y

# --- IPv4 via DHCP; auto-bring-up the interface ----------------------------
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_AUTO_INIT=y
# Do not block boot waiting for the interface or an address: on first boot
# Wi-Fi is not yet provisioned and the shell must come up immediately (with a
# nonzero timeout, net_config stalls boot until the dormant Wi-Fi interface
# would come up). net_config still starts DHCP; the app waits for L4 via
# conn_mgr.
CONFIG_NET_CONFIG_NEED_IPV4=n
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_CONFIG_SETTINGS=y

# --- Net buffers / stacks sized for the Wi-Fi driver ------------------------
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4608
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- Heap: Wi-Fi driver needs ~50K on top of the app/mbedTLS usage ----------
CONFIG_HEAP_MEM_POOL_SIZE=98304

# --- mbedTLS heap headroom for cloud broker cert chains --------------------
CONFIG_MBEDTLS_HEAP_SIZE=60000

# --- Runtime device identity (download-the-hex flow, as in quickstart) ------
# The published binary carries no device credentials; identity is generated
# on-device and stored in NVS from the shell:
#   iotcprov provision <duid>   /  iotc config  (paste iotcDeviceConfig.json)
CONFIG_IOTCONNECT_IDENTITY_NVS=y
CONFIG_IOTCONNECT_ONDEVICE_KEYGEN=y
CONFIG_IOTCONNECT_SHELL=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="iotc_mbedtls_config.h"
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y

# --- Shell (base64 cert/key + JSON paste need generous buffers) -------------
CONFIG_SHELL=y
# On-device keygen (x509 write) overflows the default shell stack.
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_SHELL_CMD_BUFF_SIZE=3072
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=4096
CONFIG_KERNEL_SHELL=y
CONFIG_REBOOT=y

# --- Distributable artifact: emit zephyr.hex (addresses embedded) -----------
CONFIG_BUILD_OUTPUT_HEX=y
