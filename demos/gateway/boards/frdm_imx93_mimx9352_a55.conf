# FRDM-IMX93 Cortex-A55 board config for the gateway demo.
#
# Same Zephyr-on-A55 platform recipe as the quickstart (Ethernet bearer,
# raw-eMMC identity store -- this target has no NOR flash and no NVS), plus
# the demo's own eMMC spool region and the lpuart1 ingest link enabled in
# boards/frdm_imx93_mimx9352_a55.overlay.
#
# Board target: frdm_imx93/mimx9352/a55  (needs the aarch64-zephyr-elf
# toolchain; build with USE_NXP_SPSDK_IMAGE=y for the bootable flash.bin).

# --- Bearer: native Ethernet (i.MX93 ENET, RGMII, Motorcomm YT8521 PHY) -----
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_NXP_ENET=y
CONFIG_MDIO=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_MBEDTLS_HEAP_SIZE=60000

# --- Identity persistence: raw eMMC sector region (no NOR flash here) --------
CONFIG_SETTINGS=n
CONFIG_SETTINGS_NVS=n
CONFIG_NVS=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_IOTCONNECT_IDENTITY_DISK=y
CONFIG_IOTCONNECT_IDENTITY_DISK_NAME="SD2"
CONFIG_IOTCONNECT_IDENTITY_DISK_SECTOR=20000000

# --- eMMC block access: identity store + the demo's spool ring ---------------
# (spool region: CONFIG_GATEWAY_SPOOL_* defaults -- sector 20,100,000, 3 MB)
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_MMC=y
CONFIG_MMC_STACK=y
CONFIG_SDHC=y
