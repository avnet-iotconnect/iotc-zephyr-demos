# Standalone west manifest for iotc-zephyr-demos.
#
# This repo is the manifest repo. It pulls Zephyr, the IOTCONNECT SDK (which is
# itself a Zephyr module and brings the public API + transport seam), and the
# portable iotc-c-lib core. Demos here build against the SDK module.
#
# Workspace after `west update`:
#   <ws>/
#     iotc-zephyr-demos/      (self, manifest repo == this)
#     zephyr/                 (v4.4.1)
#     modules/lib/iotc-zephyr-sdk/
#     modules/lib/iotc-c-lib/ (+ cJSON submodule)
manifest:
  version: "1.2"

  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos
    - name: avnet
      url-base: https://github.com/avnet-iotconnect

  projects:
    - name: zephyr
      remote: zephyrproject
      revision: v4.4.1
      import:
        name-allowlist:
          - cmsis
          - cmsis_6        # CMSIS-Core split out of `cmsis` in Zephyr 4.x
          - cmsis-nn       # TFLM optimized kernels (vision-occupancy)
          - mbedtls
          - tf-psa-crypto  # mbedTLS 4.x split: mbedtls's CMake requires it
          - mcuboot
          - hal_nxp        # FRDM-MCXN947 reference target
          - hal_atmel      # SAM E54 Xplained Pro (same54_xpro, legacy Atmel tree)
          # - hal_nordic
          # - hal_st
          # - hal_renesas

    # TFLite-Micro inference engine (vision-occupancy demo). Zephyr carries
    # this in its optional group (submanifests/optional.yaml); pin the same
    # revision here so the standalone workspace gets it without group games.
    # In a vanilla zephyrproject workspace enable it instead with:
    #   west config manifest.project-filter -- +tflite-micro && west update tflite-micro
    - name: tflite-micro
      remote: zephyrproject
      revision: fcc760af130f3a595b5802cdebcc77461e54f382
      path: modules/lib/tflite-micro

    - name: iotc-zephyr-sdk
      remote: avnet
      # Needs the shared samples (quickstart/c2d-led/click-telemetry) that the
      # demos here wrap, IOTCONNECT_WIFI_AUTOCONNECT, the credential-free
      # sample builds (FRDM-RW612), and the OTA-to-MCUboot module with the
      # S3-compatible TLS buffers. Move to the next release tag when one is
      # cut.
      revision: aa71682b8471ab692466eb06465f3e19d9d08ee3
      path: modules/lib/iotc-zephyr-sdk

    - name: iotc-c-lib
      remote: avnet
      # Needs ct:2 module-command routing + urls[] parsing (AI Model push).
      revision: d3ff2bc43a5170d1c26eb54c7a9f82c392c3cf53
      path: modules/lib/iotc-c-lib
      submodules: true      # checks out lib/cJSON

  self:
    path: iotc-zephyr-demos
